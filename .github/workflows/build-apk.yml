name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        with:
          name: 4DFit-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Run unit tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --console=plain 2>&1 | tee test.log

      # Publishes the log (and the APK when it exists) to the "build-output" branch,
      # so results can be read without access to the Actions log storage.
      - name: Publish build output
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          cp test.log out/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          echo "${{ job.status }} run=${{ github.run_number }} sha=${{ github.sha }}" > out/status.txt
          cd out
          git init -q -b build-output
          git add -A
          git -c user.name="4dfit-ci" -c user.email="ci@users.noreply.github.com" commit -q -m "Build ${{ github.run_number }}: ${{ job.status }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-output
