org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# 4D FIT backend configuration
# fourdfit.useMockApi=true   -> runs fully on-device with the mock API (default)
# fourdfit.useMockApi=false  -> talks to the REST backend at fourdfit.apiBaseUrl
# The base URL must end with "/" and must be HTTPS for release builds.
# For the bundled Node backend on the Android emulator use: http://10.0.2.2:8080/v1/
# (cleartext to 10.0.2.2 is only allowed in debug builds).
# ---------------------------------------------------------------------------
fourdfit.useMockApi=true
fourdfit.apiBaseUrl=https://api.your-domain.com/v1/
